[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-antivirus"
version = "0.4.1"
description = "Учебный прототип Next-Gen AV: статический PE-анализ + ML-классификация + карантин"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AI-Antivirus contributors" }]
keywords = ["antivirus", "malware", "edr", "pefile", "machine-learning", "security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pefile>=2024.8.26",
    "scikit-learn>=1.4,<2.0",
    "numpy>=1.26,<3.0",
    "pandas>=2.1,<4.0",
    "joblib>=1.3,<2.0",
]

[project.optional-dependencies]
lightgbm = ["lightgbm>=4.0,<5.0"]
crypto = ["cryptography>=42.0"]
monitor = ["watchdog>=4.0"]
yara = ["yara-python>=4.5"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
aiav = "aiav.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

# ------------------------------------------------------------------ #
# Ruff: линтер + форматтер
# ------------------------------------------------------------------ #
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # comprehensions
    "UP",  # pyupgrade
    "SIM", # simplify
    "RET", # return
    "PTH", # pathlib
]
ignore = [
    "E501",   # длина строки контролируется форматтером
    "B008",   # вызов функции в аргументе по умолчанию (argparse)
    "SIM108", # тернарник не всегда читаемее
    "RET504", # лишнее присваивание перед return — иногда нагляднее
    # Ниже — осознанные исключения, а не «заглушённые» предупреждения:
    "PTH101", # os.chmod: нужны условные ветки posix/nt с разными режимами
    "PTH105", # os.replace: атомарная подмена файла, Path.replace — тот же вызов
    "PTH123", # open(..., "rb"): поблочное чтение больших файлов, Path.open не короче
    "PTH202", # os.path.getsize в hot-path предфильтра
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "S101"]
"tools/*" = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["aiav"]

# ------------------------------------------------------------------ #
# pytest
# ------------------------------------------------------------------ #
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tools"]
addopts = "-ra --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

# ------------------------------------------------------------------ #
# mypy
# ------------------------------------------------------------------ #
[tool.mypy]
python_version = "3.10"
files = ["src/aiav"]
ignore_missing_imports = true
warn_unused_ignores = false
warn_redundant_casts = true
no_implicit_optional = true
